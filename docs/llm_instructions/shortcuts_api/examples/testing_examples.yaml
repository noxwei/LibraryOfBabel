testing_examples:
  production_urls:
    base: "https://api.ashortstayinhell.com:5562/api/shortcuts"
    auth_required: true
    auth_method: "?api_key=***REMOVED***"
    
  development_urls:
    base: "http://localhost:5001/api/shortcuts"  
    auth_required: false
    note: "For testing and development only"
    
  endpoint_testing_matrix:
    health:
      production: "https://api.ashortstayinhell.com:5562/api/shortcuts/health"
      development: "http://localhost:5001/api/shortcuts/health"
      auth_required: false
      
    books_count:
      production: "https://api.ashortstayinhell.com:5562/api/shortcuts/books/count?api_key=***REMOVED***"
      development: "http://localhost:5001/api/shortcuts/books/count"
      expected_response: "2503"
      
    random_book:
      production: "https://api.ashortstayinhell.com:5562/api/shortcuts/random/book?api_key=***REMOVED***"
      development: "http://localhost:5001/api/shortcuts/random/book"
      expected_format: '{"id": 123, "title": "Book", "author": "Author", "shortcuts_ready": true}'
      
    search_boolean:
      production: "https://api.ashortstayinhell.com:5562/api/shortcuts/search/love/has-results?api_key=***REMOVED***"
      development: "http://localhost:5001/api/shortcuts/search/love/has-results"
      expected_response: "true or false"
      
  curl_test_commands:
    health_check: |
      # No auth required - works on both
      curl "https://api.ashortstayinhell.com:5562/api/shortcuts/health"
      curl "http://localhost:5001/api/shortcuts/health"
      
    production_with_auth: |
      # Production API key already included
      curl "https://api.ashortstayinhell.com:5562/api/shortcuts/books/count?api_key=***REMOVED***"
      curl "https://api.ashortstayinhell.com:5562/api/shortcuts/random/book?api_key=***REMOVED***"
      
    development_no_auth: |
      # Development server - no auth needed
      curl "http://localhost:5001/api/shortcuts/books/count"
      curl "http://localhost:5001/api/shortcuts/random/book"
      curl "http://localhost:5001/api/shortcuts/search/love/has-results"
      
  testing_workflow:
    step1: "Test health endpoint (no auth) to verify connectivity"
    step2: "Test development server endpoints without auth"
    step3: "Test production endpoints with API key"
    step4: "Document any issues or unexpected responses"
    
  common_testing_mistakes:
    - "Forgetting API key for production endpoints"
    - "Using wrong port (5562 for production, 5001 for development)"
    - "Testing auth-required endpoints without authentication"
    - "Not checking if development server is running"