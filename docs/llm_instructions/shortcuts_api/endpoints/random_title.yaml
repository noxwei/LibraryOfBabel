endpoint:
  name: "Random Title"
  path: "/random/title"
  method: "GET"
  authentication: true
  
  description: "Returns a random book title as plain text"
  
  url: "https://api.ashortstayinhell.com:5562/api/shortcuts/random/title"
  
  parameters:
    - name: "api_key"
      type: "string"
      required: true
      location: "query"
      description: "API authentication key"
      example: "?api_key=YOUR_API_KEY"
  
  response:
    type: "text/plain"
    format: "single_value"
    description: "Random book title as plain text"
    
    examples: 
      - "The Coitus Chronicles"
      - "Noor"
      - "The Elegant Universe"
      - "Gideon the Ninth"
    
    data_type: "string"
    randomness: true
    
  ios_shortcuts:
    action: "Get Contents of URL"
    url: "https://api.ashortstayinhell.com:5562/api/shortcuts/random/title?api_key=***REMOVED***"
    method: "GET"
    response_handling: "Use directly - no JSON parsing needed"
    
    shortcuts_workflows:
      daily_inspiration:
        - "Get random title"
        - "Create notification: 'Today's book inspiration: [title]'"
        
      reading_roulette:
        - "Get random title"
        - "Search library catalog for the book"
        - "Add to reading list"
        
      creative_prompt:
        - "Get random title"
        - "Use as writing prompt or story inspiration"
        
  use_cases:
    - "Daily book inspiration notifications"
    - "Random reading suggestions"
    - "Creative writing prompts"
    - "Book discovery games"
    - "Social media content"
    
  data_jar_usage:
    store_as: "latest_random_title"
    data_type: "text"
    update_frequency: "on_demand"
    history_tracking: "daily_inspiration_titles"
    
  curl_examples:
    production: |
      curl "https://api.ashortstayinhell.com:5562/api/shortcuts/random/title?api_key=***REMOVED***"
      
    development: |
      curl "http://localhost:5001/api/shortcuts/random/title"
      
    multiple_calls: |
      # Get 3 random titles
      for i in {1..3}; do
        curl "http://localhost:5001/api/shortcuts/random/title"
        echo
      done
  
  test_results:
    randomness: "✅ Returns different titles on each call"
    response_format: "✅ Plain text (not JSON)"
    development_server: "✅ Working without auth"
    examples_captured: ["The Coitus Chronicles", "Noor"]
    
  performance:
    response_time: "< 150ms"
    database_query: "ORDER BY RANDOM() LIMIT 1"
    rate_limit: "60 requests/minute"
    
  troubleshooting:
    repeated_titles:
      cause: "Normal behavior with large library"
      note: "2503 books means low probability of immediate repeats"
      
    empty_response:
      response: "No books available"
      cause: "Database connection issue"
      check: "/health endpoint first"
      
    invalid_characters:
      cause: "Some titles contain special characters"
      handling: "iOS Shortcuts handles UTF-8 automatically"
      
  integration_examples:
    ios_shortcut_inspiration:
      name: "Daily Book Inspiration"
      trigger: "Time of day (9 AM)"
      steps:
        1: "Get Contents of URL → random/title"
        2: "Set variable 'BookTitle'"
        3: "Show Notification: '📚 Today's inspiration: [BookTitle]'"
        
    social_media:
      name: "Book Tweet Generator"
      steps:
        1: "Get random title"
        2: "Format: 'Currently thinking about: [title] 📖 #books #reading'"
        3: "Copy to clipboard or share"
        
    data_jar_tracker:
      name: "Book Discovery Log"
      steps:
        1: "Get random title"
        2: "Get current date"
        3: "Store in Data Jar: 'discoveries_[date]' = [title]"
        
  creative_applications:
    writing_prompts:
      - "Use title as story inspiration"
      - "Create alternative endings"
      - "Write book reviews without reading"
      
    games:
      - "Book title charades"
      - "Guess the genre from title"
      - "Create reading challenges"
      
  last_tested: "2025-07-19T03:20:00"
  test_status: "✅ WORKING - Verified randomness and plain text"