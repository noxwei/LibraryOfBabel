endpoint:
  name: "Random Citation (Formatted Text)"
  path: "/random/citation"
  method: "GET"
  authentication: true
  
  description: "Returns properly formatted academic citation - perfect for iOS Shortcuts sharing and note-taking"
  
  url: "https://api.ashortstayinhell.com:5562/api/shortcuts/random/citation"
  
  parameters:
    - name: "api_key"
      type: "string"
      required: true
      location: "query"
      description: "API authentication key"
      example: "?api_key=YOUR_API_KEY"
  
  response:
    type: "text/plain"
    format: "formatted_citation"
    description: "Academic-style citation ready for copy/paste into notes or documents"
    
    examples:
      typical_response: "Greene, Brian. The Elegant Universe (1999)"
      with_unknown_date: "Gaiman, Neil. Good Omens (Unknown)"
      format_pattern: "[Author Last Name, First Name]. [Title] ([Year])"
    
    data_type: "string (formatted text)"
    
  ios_shortcuts:
    action: "Get Contents of URL"
    url: "https://api.ashortstayinhell.com:5562/api/shortcuts/random/citation?api_key=YOUR_KEY"
    method: "GET"
    response_handling: "Use directly as text - no JSON parsing needed"
    
    shortcuts_workflows:
      citation_generator:
        - "Get Contents of URL (this endpoint)"
        - "Copy to Clipboard"
        - "Show Notification: 'Citation copied to clipboard'"
        
      research_note_maker:
        - "Get Contents of URL → Random citation"
        - "Ask for Input: Your notes about this book"
        - "Text: Combine citation + notes"
        - "Add to Notes app or Data Jar"
        
      daily_reading_inspiration:
        - "Get Contents of URL → Random citation"
        - "Text: 'Today's reading inspiration: [citation]'"
        - "Share via Messages/Social media"
        
  use_cases:
    academic_work:
      - "Quick citation generation for research"
      - "Bibliography building and management"
      - "Academic note-taking assistance"
      
    content_sharing:
      - "Social media book recommendations"
      - "Reading list sharing with proper attribution"
      - "Book club discussion preparation"
      
    personal_organization:
      - "Reading journal entries"
      - "Book recommendation tracking"
      - "Literary reference collection"
      
  data_jar_usage:
    store_as: "random_citations_history"
    data_type: "string"
    analytics: "Track citation preferences and reading patterns"
    
  curl_examples:
    production: |
      curl "https://api.ashortstayinhell.com:5562/api/shortcuts/random/citation?api_key=YOUR_KEY"
      
    development: |
      curl "http://localhost:5001/api/shortcuts/random/citation"
      
    multiple_citations: |
      # Generate multiple citations
      for i in {1..5}; do
        echo "Citation $i:"
        curl -s "http://localhost:5001/api/shortcuts/random/citation"
        echo
      done
      
  test_results:
    verified_format: '✅ "Author, First. Title (Year)" format confirmed'
    author_handling: "✅ Uses books with non-NULL author information"
    date_extraction: "✅ Extracts year from publication_date field"
    fallback_handling: "✅ Shows 'Unknown' for missing publication dates"
    
  performance:
    response_time: "< 200ms"
    database_query: |
      SELECT author, title, publication_date 
      FROM books 
      WHERE author IS NOT NULL 
      ORDER BY RANDOM() 
      LIMIT 1
    efficiency: "Simple random selection with author filter"
    
  database_details:
    table: "books"
    required_fields: ["author", "title", "publication_date"]
    author_filter: "WHERE author IS NOT NULL excludes incomplete records"
    date_processing: "Splits publication_date on '-' to extract year"
    
  formatting_logic:
    citation_format: "[author]. [title] ([year])"
    year_extraction: "publication_date.split('-')[0] if available"
    fallback_year: "Unknown if publication_date is NULL or invalid"
    text_processing: "No additional formatting - uses raw database values"
    
  integration_examples:
    ios_shortcut_bibliography_builder:
      name: "Research Bibliography Generator"
      steps:
        1: "Repeat 10 times:"
        2: "Get Contents of URL → /random/citation"
        3: "Add to list: research_bibliography"
        4: "Text: Join list with newlines"
        5: "Copy to clipboard for paste into document"
        
    reading_journal_automation:
      name: "Daily Reading Entry"
      steps:
        1: "Get Contents of URL → Random citation"
        2: "Ask for Input: 'Rate this book (1-5)'"
        3: "Ask for Input: 'Your thoughts?'"
        4: "Text: '[citation] | Rating: [rating] | Notes: [thoughts]'"
        5: "Append to Data Jar: reading_journal"
        
    book_recommendation_engine:
      name: "Smart Book Recommender"
      workflow: "Get citation → Check if user has read → If not, add to recommendations → Share recommendation"
      
  comparison_with_other_endpoints:
    random_citation: "/random/citation"
    random_title: "/random/title"
    random_author: "/random/author"
    
    when_to_use_citation: "Need formatted reference for academic/sharing purposes"
    when_to_use_title: "Only need book title for simple workflows"
    when_to_use_author: "Only need author name for research/discovery"
    
    formatting_value: "Citation pre-formatted vs raw data from other endpoints"
      
  troubleshooting:
    no_books_available:
      response: "No books available"
      meaning: "No books with author information in database"
      
    unknown_year:
      response: "Author Name. Book Title (Unknown)"
      meaning: "Book exists but publication_date is NULL/invalid"
      note: "This is normal behavior, not an error"
      
    formatting_inconsistency:
      issue: "Citation format doesn't match academic standards"
      note: "Uses simplified format optimized for mobile display"
      customization: "Format can be adjusted in API if needed"
      
  shortcuts_best_practices:
    clipboard_integration: "Use 'Copy to Clipboard' for easy pasting"
    sharing_workflows: "Perfect for social media book recommendations"
    note_taking: "Combine with user input for personal reading notes"
    automation: "Great for daily reading inspiration routines"
    
  academic_standards:
    current_format: "Author. Title (Year)"
    apa_compatibility: "Close to APA author-date style"
    mla_compatibility: "Similar to MLA works cited format"
    customization_note: "Simplified for mobile sharing, not strict academic compliance"
    
  last_tested: "2025-07-19T03:58:00"
  test_status: "✅ WORKING - Returns properly formatted citations"
  verified_examples: ["Greene, Brian. The Elegant Universe (1999)", "Author formatting confirmed", "Year extraction working"]