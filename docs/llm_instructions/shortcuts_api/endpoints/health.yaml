endpoint:
  name: "Health Check"
  path: "/health"
  method: "GET"
  authentication: false
  
  description: "System health check and endpoint discovery"
  
  url: "https://api.ashortstayinhell.com:5562/api/shortcuts/health"
  
  parameters: []
  
  response:
    type: "application/json"
    format: "object"
    
    schema:
      status:
        type: "string"
        description: "API health status"
        example: "healthy"
        
      designed_by:
        type: "string"
        description: "API architect"
        example: "Dr. Elena Rodriguez (IAV)"
        
      philosophy:
        type: "string"
        description: "Design philosophy"
        example: "Information architecture makes complex knowledge feel simple"
        
      namespace:
        type: "string"
        description: "API namespace"
        example: "shortcuts"
        
      optimized_for:
        type: "array"
        description: "Target platforms"
        example: ["iOS Shortcuts", "Data Jar", "Mobile Workflows"]
        
      endpoints_available:
        type: "array"
        description: "List of available endpoint paths"
        example: ["/books/count", "/random/title", "/random/author"]
        
      timestamp:
        type: "string"
        description: "Response timestamp (ISO format)"
        example: "2025-07-19T03:07:42.648063"
  
  ios_shortcuts:
    action: "Get Contents of URL"
    url: "https://api.ashortstayinhell.com:5562/api/shortcuts/health"
    method: "GET"
    headers: {}
    
  use_cases:
    - "Test API connectivity"
    - "Discover available endpoints"
    - "Monitor API status"
    - "Troubleshoot connection issues"
    
  curl_examples:
    basic: |
      curl "https://api.ashortstayinhell.com:5562/api/shortcuts/health"
      
    formatted: |
      curl -s "https://api.ashortstayinhell.com:5562/api/shortcuts/health" | python3 -m json.tool
  
  test_status: "✅ TESTED - Working perfectly"
  last_tested: "2025-07-19T03:07:42"
  
  troubleshooting:
    no_response:
      - "Check internet connection"
      - "Verify URL: api.ashortstayinhell.com:5562"
      - "Confirm HTTPS protocol"
      
    timeout:
      - "Server may be restarting"
      - "Try again in 30 seconds"
      - "Check if port 5562 is accessible"
      
    ssl_errors:
      - "Certificate may be updating"
      - "Try -k flag with curl for testing"
      - "Verify domain name spelling"