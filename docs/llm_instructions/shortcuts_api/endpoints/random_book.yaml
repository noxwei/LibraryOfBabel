endpoint:
  name: "Random Book (Combined)"
  path: "/random/book"
  method: "GET"
  authentication: true
  
  description: "Returns random book with title, author, and ID in one response - perfect for iOS Shortcuts dictionary splitting"
  
  url: "https://api.ashortstayinhell.com:5562/api/shortcuts/random/book"
  
  parameters:
    - name: "api_key"
      type: "string"
      required: true
      location: "query"
      description: "API authentication key"
      example: "?api_key=YOUR_API_KEY"
  
  response:
    type: "application/json"
    format: "dictionary"
    description: "Combined book information - easily split in iOS Shortcuts"
    
    schema:
      id:
        type: "integer"
        description: "Unique book identifier"
        example: 3283
        
      title:
        type: "string"
        description: "Book title"
        example: "The Hunchback of Notre-Dame (AmazonClassics Edition)"
        
      author:
        type: "string"
        description: "Book author"
        example: "Hugo, Victor"
        
      shortcuts_ready:
        type: "boolean"
        description: "Indicates response is shortcuts-optimized"
        example: true
    
    examples:
      - id: 3283
        title: "The Hunchback of Notre-Dame (AmazonClassics Edition)"
        author: "Hugo, Victor"
        shortcuts_ready: true
        
      - id: 195
        title: "The Black God's Drums"
        author: "P. Djèlí Clark"
        shortcuts_ready: true
        
      - id: 1855
        title: "Beyond Measure: The Hidden History of Measurement"
        author: "James Vincent"
        shortcuts_ready: true
        
  ios_shortcuts:
    action: "Get Contents of URL"
    url: "https://api.ashortstayinhell.com:5562/api/shortcuts/random/book?api_key=YOUR_KEY"
    method: "GET"
    response_handling: "Get Dictionary from JSON → Split into variables"
    
    splitting_workflow:
      1: "Get Contents of URL (this endpoint)"
      2: "Get Dictionary from Input"
      3: "Get Dictionary Value for 'title' → Store as BookTitle"
      4: "Get Dictionary Value for 'author' → Store as BookAuthor"  
      5: "Get Dictionary Value for 'id' → Store as BookID"
      
    advantages:
      - "Single API call instead of 3 separate calls"
      - "Guaranteed same book for title/author/id"
      - "Efficient for iOS Shortcuts dictionary handling"
      - "Reduced network requests"
      
  use_cases:
    single_book_workflows:
      - "Random book recommendation cards"
      - "Daily book inspiration with full details"
      - "Book lookup by ID for additional information"
      - "Social media posts with complete book info"
      
    data_persistence:
      - "Store complete book record in Data Jar"
      - "Build reading history with full metadata"
      - "Create book recommendation database"
      
  data_jar_usage:
    store_complete_object: "random_book_today"
    individual_values:
      - "latest_book_title"
      - "latest_book_author" 
      - "latest_book_id"
    history_tracking: "daily_book_discoveries"
    
  curl_examples:
    production: |
      curl "https://api.ashortstayinhell.com:5562/api/shortcuts/random/book?api_key=YOUR_KEY"
      
    development: |
      curl "http://localhost:5001/api/shortcuts/random/book"
      
    formatted: |
      curl -s "http://localhost:5001/api/shortcuts/random/book" | python3 -m json.tool
      
    extract_values: |
      # Extract individual values
      curl -s "http://localhost:5001/api/shortcuts/random/book" | \
      python3 -c "import json, sys; data=json.load(sys.stdin); print(f'Title: {data[\"title\"]}, Author: {data[\"author\"]}, ID: {data[\"id\"]}')"
  
  test_results:
    randomness: "✅ Returns different books on each call"
    response_format: "✅ JSON dictionary with title, author, id"
    development_server: "✅ Working without auth"
    database_query: "✅ Uses book_id column correctly"
    verified_examples: [
      "Hugo, Victor - The Hunchback of Notre-Dame",
      "P. Djèlí Clark - The Black God's Drums", 
      "James Vincent - Beyond Measure"
    ]
    
  performance:
    response_time: "< 150ms"
    database_query: "SELECT book_id, title, author WHERE author IS NOT NULL ORDER BY RANDOM() LIMIT 1"
    efficiency: "1 API call vs 3 separate calls"
    rate_limit: "60 requests/minute"
    
  troubleshooting:
    missing_author:
      handling: "Query filters for books WITH authors only"
      fallback: "Returns error if no books with authors exist"
      
    database_error:
      response: '{"error": "Random book unavailable", "shortcuts_ready": true}'
      check: "Test /health endpoint first"
      
    json_parsing:
      ios_shortcuts: "Use 'Get Dictionary from Input' action"
      manual: "Response is valid JSON with title, author, id keys"
      
  integration_examples:
    ios_shortcut_complete:
      name: "Random Book Card"
      steps:
        1: "Get Contents of URL → random/book"
        2: "Get Dictionary from Input"
        3: "Get Dictionary Value → 'title' → BookTitle"
        4: "Get Dictionary Value → 'author' → BookAuthor"
        5: "Get Dictionary Value → 'id' → BookID"
        6: "Text: '📚 [BookTitle] by [BookAuthor] (ID: [BookID])'"
        7: "Show Result"
        
    data_jar_storage:
      name: "Book Discovery Logger"
      steps:
        1: "Get random book"
        2: "Get current date"
        3: "Store entire dictionary in Data Jar as 'book_[date]'"
        4: "Also store individual values for quick access"
        
    social_sharing:
      name: "Book Social Post"
      format: "📖 Random discovery: '[title]' by [author] - what do you think of this one? #books #reading"
      
    reading_challenge:
      name: "Random Book Challenge"
      steps:
        1: "Get random book"
        2: "Search library catalog using book ID"
        3: "Add to reading list or purchase"
        4: "Set reading goal reminder"
        
  database_details:
    table: "books"
    columns_used: ["book_id", "title", "author"]
    filter: "WHERE author IS NOT NULL"
    randomization: "ORDER BY RANDOM()"
    sample_size: "2503 books total"
    
  last_tested: "2025-07-19T03:35:00"
  test_status: "✅ WORKING PERFECTLY - Fixed book_id column issue"
  update_notes: "Fixed SQL query to use 'book_id' instead of 'id' column"