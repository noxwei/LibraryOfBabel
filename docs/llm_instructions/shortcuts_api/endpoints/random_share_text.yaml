endpoint:
  name: "Random Share Text (Social Media Ready)"
  path: "/random/share-text"
  method: "GET"
  authentication: true
  
  description: "Returns social media ready text about random book - perfect for iOS Shortcuts sharing workflows"
  
  url: "https://api.ashortstayinhell.com:5562/api/shortcuts/random/share-text"
  
  parameters:
    - name: "api_key"
      type: "string"
      required: true
      location: "query"
      description: "API authentication key"
      example: "?api_key=YOUR_API_KEY"
  
  response:
    type: "text/plain"
    format: "social_media_text"
    description: "Pre-formatted text with emoji and engaging language ready for social sharing"
    
    examples:
      typical_response: "📚 Currently reading: The Elegant Universe by Brian Greene"
      fallback_response: "📚 Building my reading list!"
      format_pattern: "📚 Currently reading: [Title] by [Author]"
    
    data_type: "string (social media formatted)"
    emoji_included: "📚 book emoji for visual appeal"
    
  ios_shortcuts:
    action: "Get Contents of URL"
    url: "https://api.ashortstayinhell.com:5562/api/shortcuts/random/share-text?api_key=***REMOVED***"
    method: "GET"
    response_handling: "Use directly as text - ready for sharing actions"
    
    shortcuts_workflows:
      instant_book_share:
        - "Get Contents of URL (this endpoint)"
        - "Share via Twitter/Instagram/Messages"
        - "No additional formatting needed"
        
      reading_status_updater:
        - "Get Contents of URL → Random share text"
        - "Copy to Clipboard"
        - "Show: 'Reading status copied - paste into social media'"
        
      daily_reading_motivation:
        - "Schedule daily automation"
        - "Get Contents of URL → Random share text"
        - "Post to social media or send to reading group"
        
  use_cases:
    social_media:
      - "Twitter/Instagram reading updates"
      - "Facebook book recommendations"
      - "LinkedIn professional reading shares"
      
    community_engagement:
      - "Book club discussion starters"
      - "Reading group inspiration"
      - "Literary community participation"
      
    personal_motivation:
      - "Daily reading commitment posts"
      - "Reading goal accountability"
      - "Literary lifestyle sharing"
      
  data_jar_usage:
    store_as: "shared_book_history"
    data_type: "string"
    tracking: "Monitor which books you've shared for variety"
    
  curl_examples:
    production: |
      curl "https://api.ashortstayinhell.com:5562/api/shortcuts/random/share-text?api_key=***REMOVED***"
      
    development: |
      curl "http://localhost:5001/api/shortcuts/random/share-text"
      
    batch_generation: |
      # Generate multiple share texts for variety
      for i in {1..3}; do
        echo "Share option $i:"
        curl -s "http://localhost:5001/api/shortcuts/random/share-text"
        echo
      done
      
  test_results:
    verified_format: '✅ "📚 Currently reading: [Title] by [Author]" format confirmed'
    emoji_included: "✅ Book emoji (📚) consistently included"
    author_handling: "✅ Uses books with non-NULL author information"
    fallback_working: "✅ Graceful fallback when no books available"
    
  performance:
    response_time: "< 200ms"
    database_query: |
      SELECT title, author 
      FROM books 
      WHERE author IS NOT NULL 
      ORDER BY RANDOM() 
      LIMIT 1
    efficiency: "Simple random selection with author filter"
    
  database_details:
    table: "books"
    required_fields: ["title", "author"]
    author_filter: "WHERE author IS NOT NULL excludes incomplete records"
    randomization: "ORDER BY RANDOM() for content variety"
    
  formatting_logic:
    share_format: "📚 Currently reading: [title] by [author]"
    emoji_placement: "Book emoji at start for visual appeal"
    language_style: "Engaging, personal tone suitable for social media"
    fallback_message: "📚 Building my reading list!" when no books available"
    
  integration_examples:
    ios_shortcut_social_scheduler:
      name: "Weekly Reading Updates"
      steps:
        1: "Schedule: Every Monday 9am"
        2: "Get Contents of URL → /random/share-text"
        3: "Share via Twitter with hashtags #reading #books"
        4: "Log to Data Jar: social_shares_history"
        
    book_club_inspiration:
      name: "Random Book Club Suggestion"
      steps:
        1: "Get Contents of URL → Random share text"
        2: "Text: Replace 'Currently reading' with 'Book club suggestion:'"
        3: "Send via Messages to book club group"
        
    reading_accountability:
      name: "Daily Reading Commitment"
      workflow: "Get share text → Post to social → Tag reading buddies → Increase accountability"
      
  social_media_optimization:
    character_count: "Under 100 characters - perfect for Twitter"
    hashtag_friendly: "Easy to add #reading #books #literature hashtags"
    visual_appeal: "📚 emoji makes posts more engaging"
    platform_compatibility: "Works on Twitter, Instagram, Facebook, LinkedIn"
    
  comparison_with_other_endpoints:
    random_share_text: "/random/share-text"
    random_citation: "/random/citation"
    random_title: "/random/title"
    
    when_to_use_share_text: "Social media posts, casual sharing"
    when_to_use_citation: "Academic references, formal sharing"
    when_to_use_title: "Simple book identification only"
    
    engagement_value: "Share text optimized for social engagement vs formal citation"
      
  troubleshooting:
    fallback_response:
      message: "📚 Building my reading list!"
      meaning: "No books with author information available"
      note: "This is normal fallback behavior, not an error"
      
    missing_emoji:
      issue: "Emoji not displaying properly"
      solution: "Ensure UTF-8 encoding in shortcuts and receiving apps"
      
    text_truncation:
      issue: "Long titles getting cut off in social media"
      note: "Most titles fit within social media limits"
      workaround: "Can manually edit before sharing if needed"
      
  shortcuts_best_practices:
    hashtag_addition: "Append #reading #books for better discoverability"
    scheduling: "Use with automation for regular reading updates"
    personalization: "Can edit 'Currently reading' to 'Just finished' etc."
    engagement: "Perfect for building reading community connections"
    
  content_variety:
    randomization: "Different book each time for content diversity"
    author_diversity: "Pulls from all authors in 2503 book library"
    genre_mixing: "Natural variety across different book types"
    discovery_factor: "Introduces followers to new books and authors"
    
  last_tested: "2025-07-19T04:00:00"
  test_status: "✅ WORKING - Returns engaging social media text"
  verified_examples: ["📚 Currently reading: [Title] by [Author]", "Emoji formatting confirmed", "Fallback message working"]