# LibraryOfBabel Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: libraryofbabel-config
  namespace: libraryofbabel
  labels:
    app.kubernetes.io/name: libraryofbabel-config
    app.kubernetes.io/part-of: libraryofbabel-cluster
data:
  # Database Configuration
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "knowledge_base"
  DB_USER: "weixiangzhang"
  
  # API Configuration
  API_PORT: "5565"
  API_HOST: "0.0.0.0"
  FLASK_ENV: "production"
  RUNNING_IN_CONTAINER: "true"
  
  # Logging Configuration
  LOG_PATH: "/app/logs"
  LOG_LEVEL: "INFO"
  
  # CORS Configuration
  CORS_ORIGINS: "http://localhost:3000,http://localhost:5565"
  
  # Container Environment
  PYTHONPATH: "/app"

---
apiVersion: v1
kind: Secret
metadata:
  name: libraryofbabel-secrets
  namespace: libraryofbabel
  labels:
    app.kubernetes.io/name: libraryofbabel-secrets
    app.kubernetes.io/part-of: libraryofbabel-cluster
type: Opaque
stringData:
  DB_PASSWORD: "${DB_PASSWORD}"
  API_KEY: "${API_KEY}"
  SECRET_KEY: "${SECRET_KEY}"