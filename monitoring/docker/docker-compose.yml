version: '3.8'

services:
  # Grafana - AI Agent Ready Visualization and Dashboards
  grafana:
    image: grafana/grafana:10.3.0
    container_name: libraryofbabel-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_SECURITY_ADMIN_USER=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel,grafana-clock-panel,grafana-llm-app
      - GF_FEATURE_TOGGLES_ENABLE=publicDashboards,scenes,dashboardPreviews
      - GF_API_ENABLE_CORS=true
      - GF_API_ORG_ROLE=Admin
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=grafana-llm-app
      - GF_LOG_LEVEL=info
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_ALERTING_ENABLED=false
    volumes:
      - grafana-storage:/var/lib/grafana
      - ../dashboards:/etc/grafana/provisioning/dashboards
      - ../config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    networks:
      - monitoring

  # Loki - AI Agent Ready Log Aggregation
  loki:
    image: grafana/loki:2.9.2
    container_name: libraryofbabel-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    environment:
      - LOKI_LOG_LEVEL=info
    volumes:
      - ../config/loki-config.yml:/etc/loki/local-config.yaml
      - loki-storage:/loki
    networks:
      - monitoring

  # Promtail - Log Collection Agent
  promtail:
    image: grafana/promtail:2.9.0
    container_name: libraryofbabel-promtail
    restart: unless-stopped
    volumes:
      - ../config/promtail-config.yml:/etc/promtail/config.yml
      - ../../logs:/logs:ro
      - ../../daemons:/daemons:ro
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring
    depends_on:
      - loki

  # Prometheus - AI Agent Ready Metrics Collection
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: libraryofbabel-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-admin-api'
      - '--web.cors.origin=.*'
      - '--query.timeout=2m'
      - '--query.max-concurrency=50'
    volumes:
      - ../config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-storage:/prometheus
    networks:
      - monitoring

  # AlertManager - AI Agent Ready Alert Management
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: libraryofbabel-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ../config/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - ../alerts:/etc/alertmanager/rules
      - alertmanager-storage:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
      - '--web.cors.origin=.*'
      - '--log.level=info'
      - '--cluster.listen-address='
    environment:
      - ALERTMANAGER_JIRA_WEBHOOK_URL=http://libraryofbabel-exporter:8000/webhook/jira
    networks:
      - monitoring

  # LibraryOfBabel Custom Metrics Exporter
  libraryofbabel-exporter:
    build:
      context: ../exporters
      dockerfile: Dockerfile
    container_name: libraryofbabel-exporter
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../../daemons:/data/daemons:ro
      - ../../logs:/data/logs:ro
    environment:
      - EXPORTER_PORT=8000
      - LOG_LEVEL=INFO
      - DATA_PATH=/data
    networks:
      - monitoring

  # Node Exporter - System Metrics
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: libraryofbabel-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring

  # OpenTelemetry Collector - Future AI Agent Standards
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.89.0
    container_name: libraryofbabel-otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus metrics
      - "8889:8889"   # Prometheus exporter metrics
    volumes:
      - ../config/otel-collector-config.yml:/etc/otelcol-contrib/otel-collector-config.yaml
    command: ["--config=/etc/otelcol-contrib/otel-collector-config.yaml"]
    environment:
      - OTEL_LOG_LEVEL=info
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki

  # Vector - High-Performance Observability Pipeline
  vector:
    image: timberio/vector:0.34.0-debian
    container_name: libraryofbabel-vector
    restart: unless-stopped
    ports:
      - "8686:8686"   # Vector API
    volumes:
      - ../config/vector.toml:/etc/vector/vector.toml
      - ../../logs:/var/log/libraryofbabel:ro
      - ../../daemons:/var/log/daemons:ro
    environment:
      - VECTOR_LOG=info
      - VECTOR_CONFIG=/etc/vector/vector.toml
    networks:
      - monitoring
    depends_on:
      - loki
      - prometheus

  # AI Agent Communication Gateway
  agent-gateway:
    build:
      context: ../agents
      dockerfile: Dockerfile
    container_name: libraryofbabel-agent-gateway
    restart: unless-stopped
    ports:
      - "8081:8080"   # Agent API Gateway
    volumes:
      - ../../daemons:/data/daemons:ro
      - ../../logs:/data/logs:ro
    environment:
      - GATEWAY_PORT=8080
      - PROMETHEUS_URL=http://prometheus:9090
      - LOKI_URL=http://loki:3100
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_API_KEY=${GRAFANA_API_KEY:-}
      - JIRA_WEBHOOK_URL=${JIRA_WEBHOOK_URL:-}
      - LOG_LEVEL=info
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki
      - grafana
      - libraryofbabel-exporter

volumes:
  grafana-storage:
    driver: local
  loki-storage:
    driver: local
  prometheus-storage:
    driver: local
  alertmanager-storage:
    driver: local

networks:
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1