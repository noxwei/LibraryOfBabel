# Flyway Configuration for LibraryOfBabel
# Database-First CI/CD Pipeline Configuration

# Database connection settings (will be overridden by environment variables)
flyway.url=jdbc:postgresql://localhost:5432/knowledge_base
flyway.user=weixiangzhang
flyway.password=

# Migration settings
flyway.locations=filesystem:flyway/sql
flyway.table=flyway_schema_history
flyway.baselineOnMigrate=true
flyway.baselineVersion=0
flyway.baselineDescription=Initial baseline

# Safety settings
flyway.validateOnMigrate=true
flyway.cleanDisabled=true
flyway.mixed=false

# Output settings
flyway.outputQueryResults=true

# Environment-specific overrides
# Staging: flyway.url=jdbc:postgresql://localhost:5432/library_staging
# Production: flyway.url=jdbc:postgresql://localhost:5432/library_production
# CI: flyway.url=jdbc:postgresql://localhost:5432/library_test